name: Windows CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: plugins/minimax-h3-cloud/runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CompShare CLI
        run: python -m pip install "compshare-cli==0.3.6" "typer==0.20.1" "click==8.2.1"
      - name: Run runtime tests
        run: npm test
      - name: Smoke test Windows launchers
        working-directory: plugins/minimax-h3-cloud
        shell: cmd
        run: |
          scripts\h3-onboard.cmd --help
          scripts\h3-provision.cmd --help
          scripts\h3-cloud.cmd --help
